name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test (${{ matrix.os }}, LilyPond ${{ matrix.lilypond }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Every version we support gets its own run, because what the tests read out of an installation changes between versions. Add one here to start testing against it.
        lilypond: ['2.24.3']
    env:
      # Relative to the workspace, so the same value works in bash, in Rust and on every runner without any path conversion.
      LILYPOND_TEST_INSTALL_DIR: .lilypond-installs
    steps:
      - uses: actions/checkout@v5

      # The tests read files out of a real installation rather than copies checked into the repository, so CI has to supply one.
      - name: Install LilyPond ${{ matrix.lilypond }}
        shell: bash
        run: scripts/install-lilypond.sh '${{ matrix.lilypond }}' > /dev/null

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # The tree-sitter grammar is a git dependency, so its checkout is worth caching too.
          cache-all-crates: true

      - name: Build
        run: cargo build --locked --all-targets

      - name: Test
        run: cargo test --locked

  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets
