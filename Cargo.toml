[package]
name = "ly-lsp"
version = "0.1.0"
edition = "2024"

[dependencies]
tower-lsp = "0.20" # LSP boilerplate implementation
tokio = { version = "1", features = ["full"] } # Async runtime
serde = { version = "1.0", features = ["derive"] } # serialization
serde_json = "1.0" # json parsing
dashmap = "6.1" # thread-safe HashMap to store the document content
reqwest = { version = "0.13", features = ["json"] } # http client
tree-sitter = "0.25" # incremental parser runtime
tree-sitter-lilypond = { git = "https://github.com/nwhetsell/tree-sitter-lilypond" } # LilyPond grammar
streaming-iterator = "0.1" # required to consume tree-sitter query matches

[dev-dependencies]
tempfile = "3" # temporary directories for cross-file resolution tests